[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "opshub-ai"
version = "0.1.0"
description = "Private AI intake service for OpsHub"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.146.0",
  "openai==3.35.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opshub_ai"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["opshub_ai"]

[tool.coverage.run]
branch = true
source = ["opshub_ai"]
