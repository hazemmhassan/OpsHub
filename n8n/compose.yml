services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      OPSHUB_WEBHOOK_SIGNING_SECRET: ${OPSHUB_WEBHOOK_SIGNING_SECRET}
      OPSHUB_GOOGLE_SHEET_ID: ${OPSHUB_GOOGLE_SHEET_ID:-}
      OPSHUB_GOOGLE_SHEET_NAME: ${OPSHUB_GOOGLE_SHEET_NAME:-Approved Requests}
      GENERIC_TIMEZONE: Africa/Cairo
      TZ: Africa/Cairo
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro

volumes:
  n8n_data:
